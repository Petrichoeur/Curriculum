<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florian BOBO | Neural Interface</title>
    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img id="profile-img" src="" alt="Avatar">
                    <div class="status-dot"></div>
                </div>
                <div class="profile-info">
                    <h1 id="profile-name">Loading...</h1>
                    <h2 id="profile-role">...</h2>
                </div>
            </div>

            <div class="actions">
                <a id="link-linkedin" href="#" target="_blank" class="btn btn-primary">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a id="link-cv" href="#" target="_blank" class="btn btn-outline">
                    <i class="fas fa-file-pdf"></i> CV
                </a>
            </div>

            <div class="ai-controls">
                <label><i class="fas fa-microchip"></i> MOTEUR NEURAL</label>
                <div class="select-wrapper">
                    <select id="model-select">
                        <option value="gemini-3-flash-preview" selected>Gemini 3 Flash (Preview)</option>
                        
                        <option value="gemini-2.0-flash-exp">Gemini 2.5 Flash (Stable)</option>
                    </select>
                    <i class="fas fa-chevron-down arrow-icon"></i>
                </div>
            </div>
        </aside>

        <main class="chat-container">
            <div id="chat-history" class="chat-feed"></div>
            
            <div class="input-area">
                <div class="input-box">
                    <input type="text" id="user-input" placeholder="Interroger le système..." autocomplete="off">
                    <button id="send-btn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
